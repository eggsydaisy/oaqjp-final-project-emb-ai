name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: claude-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for problems that break production, not style.
            Focus on:
            - business logic correctness
            - injection vectors (SQL, command, template) and unsafe input handling
            - unhandled edge cases and error paths
            - N+1 queries and obvious performance traps
            - anything touching auth, payments, or data deletion (always flag)

            Ignore formatting, naming, and style preferences.

            Severity:
            - "critical": will cause a security hole, data loss, or wrong behavior in production
            - "warning": worth fixing but not blocking

            Post inline comments on the affected lines, then return the structured result.
          claude_args: |
            --allowedTools Read,Grep,Glob
            --disallowedTools WebSearch
            --max-turns 15
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["critical","warning"]},"file":{"type":"string"},"message":{"type":"string"}},"required":["severity","message"]}}},"required":["findings"]}'

      - name: Gate on critical findings
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "No structured review output; failing closed."
            exit 1
          fi
          critical=$(echo "$RESULT" | jq '[.findings[] | select(.severity == "critical")] | length')
          warnings=$(echo "$RESULT" | jq '[.findings[] | select(.severity == "warning")] | length')
          echo "critical=$critical warnings=$warnings"
          if [ "$critical" -gt 0 ]; then
            echo "Critical issues found; blocking merge."
            exit 1
          fi
